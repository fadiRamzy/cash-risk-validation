<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أداة استخراج البيانات — أكواد الاستعلامات الائتمانية</title>
<link rel="icon" href="../assets/icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
  .tool-shell{max-width:820px;margin:0 auto;padding:40px 24px 80px}
  .drop{
    border:2px dashed var(--line);border-radius:var(--radius-lg);padding:44px 20px;text-align:center;
    background:var(--paper-raised);cursor:pointer;transition:border-color .15s;
  }
  .drop.drag{border-color:var(--gold-500)}
  .drop svg{width:44px;height:44px;color:var(--text-3);margin-bottom:10px}
  .log{
    background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:16px;font-family:monospace;font-size:12.5px;max-height:260px;overflow:auto;margin-top:18px;
    color:var(--text-2);white-space:pre-wrap;
  }
  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .btn{
    border:0;background:var(--navy-900);color:#fff;padding:11px 20px;border-radius:10px;
    cursor:pointer;font-weight:700;font-size:13.5px;
  }
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.secondary{background:transparent;border:1px solid var(--line);color:var(--text-1)}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-title">أداة استخراج البيانات</span>
      <span class="brand-sub">تحديث ملف codes.json من ملف PDF جديد</span>
    </div>
    <div class="topbar-actions"><a href="../index.html" class="icon-btn" title="رجوع للنظام" aria-label="رجوع">↩</a></div>
  </div>
</header>

<div class="tool-shell">
  <p style="color:var(--text-2);font-size:13.5px;margin-bottom:20px">
    ارفع ملف PDF بنفس تنسيق ملف "أكواد الاستعلام الائتماني". ستقوم الأداة باستخراج الأكواد والأسماء تلقائيًا،
    وعرض معاينة، ثم السماح بتنزيل ملف <code>codes.json</code> جديد لاستبداله داخل مجلد <code>data</code>.
  </p>

  <div class="drop" id="drop">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
    <div>اسحب ملف PDF هنا أو اضغط للاختيار</div>
    <input type="file" id="file-input" accept="application/pdf" style="display:none">
  </div>

  <div class="actions">
    <button class="btn" id="download-btn" disabled>تنزيل codes.json</button>
    <button class="btn secondary" id="clear-btn">مسح</button>
  </div>

  <div class="log" id="log">في انتظار رفع ملف…</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const CATEGORY_MAP = {
  PC:"بنوك عامة", SB:"بنوك متخصصة", CB:"بنوك تجارية", IB:"بنوك استثمارية",
  FB:"بنوك أجنبية", CC:"شركات ائتمان استهلاكي", RC:"شركات ائتمان وتقسيط",
  MF:"تمويل متناهي الصغر وجمعيات", MG:"شركات تمويل عقاري", LF:"شركات تأجير تمويلي",
  HS:"شركات إسكان وتعمير", FS:"خدمات مالية غير مصرفية", NB:"هيئات ومؤسسات أخرى",
  NG:"هيئات ومؤسسات أخرى", RA:"جهات رقابية", UC:"شركات مرافق", IC:"تأمين",
};
function categoryFor(code){
  const suffix = code.replace(/[^A-Za-z]/g,"").slice(-2).toUpperCase();
  return CATEGORY_MAP[suffix] || "أخرى";
}

const log = document.getElementById("log");
const downloadBtn = document.getElementById("download-btn");
const drop = document.getElementById("drop");
const input = document.getElementById("file-input");
let generated = null;

function print(msg){ log.textContent += "\n" + msg; log.scrollTop = log.scrollHeight; }

drop.addEventListener("click", () => input.click());
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("drag"); });
drop.addEventListener("dragleave", () => drop.classList.remove("drag"));
drop.addEventListener("drop", (e) => {
  e.preventDefault(); drop.classList.remove("drag");
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
input.addEventListener("change", () => { if (input.files[0]) handleFile(input.files[0]); });

document.getElementById("clear-btn").addEventListener("click", () => {
  log.textContent = "في انتظار رفع ملف…";
  downloadBtn.disabled = true;
  generated = null;
});

async function handleFile(file){
  log.textContent = `جارٍ قراءة الملف: ${file.name}`;
  try{
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    print(`عدد الصفحات: ${pdf.numPages}`);
    let fullText = "";
    for (let i = 1; i <= pdf.numPages; i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      fullText += content.items.map((it) => it.str).join(" ") + "\n";
    }
    const records = extractRecords(fullText);
    print(`تم استخراج ${records.length} سجلًا`);
    generated = {
      generatedAt: new Date().toISOString().slice(0,10),
      totalRecords: records.length,
      records,
    };
    downloadBtn.disabled = records.length === 0;
  }catch(err){
    print("خطأ أثناء المعالجة: " + err.message);
  }
}

// Matches a 10-char alphanumeric code (digits + 2 letters suffix) beside Arabic text,
// in either "code name" or "name code" order.
function extractRecords(text){
  const codeRe = /\b(\d{6,8}[A-Z]{2})\b/g;
  const lines = text.split(/\n|(?=\d{6,8}[A-Z]{2})/).map((l) => l.trim()).filter(Boolean);
  const seen = new Set();
  const records = [];
  for (const line of lines){
    const matches = [...line.matchAll(codeRe)];
    if (matches.length === 0) continue;
    const code = matches[0][1];
    const name = line.replace(codeRe, "").replace(/\s+/g, " ").trim();
    if (!name) continue;
    const key = code + "|" + name;
    if (seen.has(key)) continue;
    seen.add(key);
    records.push({ code, name, category: categoryFor(code) });
  }
  records.sort((a,b) => a.category.localeCompare(b.category,"ar") || a.code.localeCompare(b.code));
  return records;
}

downloadBtn.addEventListener("click", () => {
  if (!generated) return;
  const blob = new Blob([JSON.stringify(generated, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "codes.json"; a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
